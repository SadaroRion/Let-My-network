<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃啥 · 抽签器 | 星屑ノート</title>
<meta name="description" content="选择困难症克星：转一转，今天就吃这个。星屑ノート的小工具。">
<meta name="theme-color" content="#fff7ec">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="back-home" href="../">← 星屑ノート</a>
<main class="app">
  <header class="head">
    <h1>今天吃啥<span>?</span></h1>
    <p class="sub">本鱼帮你转一圈，转完就开饭 🍚</p>
  </header>

  <div class="cols">
    <section class="card stage">
      <div class="wheel-wrap" id="wheelWrap">
        <canvas id="wheel"></canvas>
        <div class="pointer" aria-hidden="true"></div>
        <button class="go" id="go" type="button">开饭<small>转！</small></button>
      </div>

      <div class="result" id="result" aria-live="polite">
        <div class="result-emoji" id="resultEmoji">🍚</div>
        <div class="result-name" id="resultName">今天吃啥？</div>
        <div class="result-quip" id="resultQuip">按下中间的大按钮，本鱼帮你抽</div>
      </div>
    </section>

    <aside class="card panel">
      <h2>菜单</h2>
      <p class="hint">一行一个，改完自动保存</p>
      <textarea id="editor" spellcheck="false" rows="11"></textarea>

      <div class="toolbar">
        <label class="switch">
          <input type="checkbox" id="avoid">
          <span>抽过的不重复</span>
        </label>
        <button class="ghost" id="reset" type="button">恢复默认</button>
      </div>

      <div class="history-block">
        <span class="k">最近</span>
        <div class="history" id="history">—</div>
      </div>
    </aside>
  </div>

  <footer class="foot">纯 HTML / CSS / JS · 零依赖 · 数据只存在本机浏览器</footer>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="js/app.js"></script>
</body>
</html>
